[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Must come before the SPA catch-all: Netlify applies the first matching rule,
# so a catch-all above this would swallow the API call and return index.html.
[[redirects]]
  from = "/api/notion"
  to = "/.netlify/functions/notion"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
